# Enable ALSA devices
monitor.alsa.rules = [
  {
    matches = [
      {
        # Match all ALSA nodes
        node.name = "~alsa_input.*"
      }
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        node.enabled = true
        priority.driver = 1000
        priority.session = 1000
      }
    }
  }
]